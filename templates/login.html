{% extends 'base.html' %}
{% block banner %}{% endblock banner %}
{% block content %}
<div class="login-center">
    <div class="login-container">
        <h2>Iniciar sesión</h2>
        <form method="post">
            {% csrf_token %}
            <div class="input-full">
                <label for="username" class="label-login">Username</label>
                <input type="text" id="username" name="username" required class="input-login">
            </div>
            <div class="input-full">
                <label for="password" class="label-login">Contraseña</label>
                <input type="password" id="password" name="password" required class="input-login">
            </div>
            <button type="submit" class="btn-agregar">Entrar</button>
        </form>
    </div>
</div>

<style>
    .login-center {
        min-height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 0;
    }
    .login-container {
        max-width: 400px;
        width: 100%;
        padding: 2.5rem 1rem 2.5rem 1rem;
        /* background: #fff; */
        border-radius: 18px;
        /* box-shadow: 0 8px 32px rgba(75,89,69,0.13); */
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 1.35rem;
    }
    .input-full {
        margin-bottom: 1.5rem;
        width: 100%;
    }
    .label-login {
        display: block;
        font-size: 1.1rem;
        font-weight: 600;
        color: #4B5945;
        margin-bottom: 0.5rem;
        text-transform: uppercase;
    }
    .input-login {
        width: 360px;
        max-width: 100%;
        padding: 1.1rem 1.5rem;
        font-size: 1.2rem;
        border-radius: 0px;
        border: 2px solid #c5c3c2;
        background: #f7f7f7;
        outline: none;
        transition: border 0.2s;
    }
    .login-container h2 {
        text-align: center;
        margin-bottom: 2.5rem;
        font-size: 2.4rem;
        font-weight: 700;
    }
    .login-container form {
        width: 100%;
    }
    .login-container button {
        width: 100%;
        margin-top: 1.5rem;
        font-size: 1.3rem;
        padding: 1.2rem 0;
        border-radius: 0px;
        background: #4B5945;
        color: #fff;
        border: none;
        font-weight: 700;
        transition: background 0.2s;
    }
    .login-container button:hover {
        background: #6a7e62ff;
    }
</style>
{% endblock %}
